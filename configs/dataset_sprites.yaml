# dataset_sprites.yaml
# Configuración regional reducida para el experimento VAE de sprites.
# La región seleccionada cubre hasta 32 tiles del área de animales.

data:
  dataset: sprites
  tsx: data/raw/sprites/tileset_colored.tsx
  png: data/raw/sprites/tileset_legacy.png
  channels: rgb            # rgb | gray
  regions:
    - {name: animales, rows: [5, 8], cols: [24, 31]}
  dedup: true
  hflip_augment: false
  val_split: 0.2
  seed: 42
  path: data/processed/sprites_animals.npz
  meta_path: data/processed/sprites_animals_meta.json
